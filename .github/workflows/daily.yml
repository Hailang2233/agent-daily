name: Daily update

on:
  schedule:
    # 每天 00:00 UTC = 08:00 北京时间
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release new methods and pick today's three
        run: node scripts/pick-daily.mjs
        env:
          RELEASE_PER_DAY: 2

      - name: Commit daily release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No daily changes"
          else
            git commit -m "chore: daily update $(date -u +%F)"
            git push
          fi

      - name: Sync anonymous view counts
        run: node scripts/fetch-heat.mjs
        continue-on-error: true

      - name: Commit heat snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heat.js
          if git diff --cached --quiet; then
            echo "No heat changes"
          else
            git commit -m "chore: sync heat $(date -u +%F)"
            git push
          fi
